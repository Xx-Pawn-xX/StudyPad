<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyPad</title>
  <link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ================= LOGIN ================= -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <div class="logo-mark">S</div>
      <h1>StudyPad</h1>
      <p>Your school workspace.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" data-auth="login">Log in</button>
        <button class="auth-tab" data-auth="signup">Sign up</button>
      </div>

      <form id="loginForm" class="auth-form">
        <input id="loginUsername" type="text" placeholder="Username" required />
        <label>
  Email
  <input
    id="loginEmail"
    type="email"
    required
    placeholder="you@example.com"
  />
</label>
        <input id="loginPassword" type="password" placeholder="Password" required />
        <button type="submit" class="primary-btn">Log in</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <input id="signupName" type="text" placeholder="Your name" required />
        <input id="signupGrade" type="text" placeholder="Grade" required />
        <input id="signupUsername" type="text" placeholder="Username" required />
        <label>
          Email
          <input
            id="signupEmail"
            type="email"
            required
            placeholder="you@example.com"
          />
        </label>
        <input id="signupPassword" type="password" placeholder="Password" required />
        <button type="submit" class="primary-btn">Create StudyPad</button>
      </form>

      <p class="auth-note">
        StudyPad saves automatically on this device.
      </p>
    </div>
  </div>


  <!-- ================= APP ================= -->
  <div id="app" class="app hidden">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="small-logo">S</div>
        <span>StudyPad</span>
      </div>

      <div class="profile">
        <div class="profile-avatar" id="profileInitial">H</div>
        <div>
          <strong id="profileName">Student</strong>
          <span id="profileGrade">Grade</span>
        </div>
      </div>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section-title">
        <span>SUBJECTS</span>
        <button id="addSubjectBtn" class="icon-btn" title="Add subject">+</button>
      </div>

      <div id="subjectsList" class="subjects-list"></div>

      <div class="sidebar-bottom">
        <button id="settingsBtn" class="sidebar-action">⚙ Settings</button>
        <button id="logoutBtn" class="sidebar-action danger-action">↪ Log out</button>
      </div>
    </aside>


    <!-- MAIN -->
    <main class="main">

      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb">
          Choose a subject and topic
        </div>

        <nav class="top-nav">
          <button class="nav-item active" data-section="notes">Notes</button>
          <button class="nav-item" data-section="homework">Homework</button>
          <button class="nav-item" data-section="studyplan">Study Plan</button>
          <button class="nav-item" data-section="tests">Tests</button>
        </nav>

        <button id="toggleAiBtn" class="ai-toggle">✦</button>
      </header>

      <section id="content" class="content"></section>

    </main>

    <!-- ================= STUDYPAD AI ================= -->
<aside id="aiPanel" class="ai-panel hidden">

  <div class="ai-header">
    <div class="ai-title">
      <div class="ai-logo">✦</div>

      <div>
        <strong>StudyPad AI</strong>
        <span>Powered by AI</span>
      </div>
    </div>

    <button id="closeAiBtn" class="icon-btn">×</button>
  </div>


  <div id="aiMessages" class="ai-messages">

    <div class="ai-welcome">

      <div class="ai-big-icon">✦</div>

      <h3>Hey!</h3>

      <p>
        I'm StudyPad AI. Ask me anything about
        studying, homework, notes, or school.
      </p>

      <div class="ai-suggestions">

        <button class="ai-suggestion">
          Explain this topic simply
        </button>

        <button class="ai-suggestion">
          Help me study for a test
        </button>

        <button class="ai-suggestion">
          Make me practice questions
        </button>

      </div>

    </div>

  </div>


  <div class="ai-input-area">

    <textarea
      id="aiInput"
      placeholder="Ask StudyPad AI..."
      rows="1"
    ></textarea>

    <button
      id="sendAiBtn"
      class="ai-send-btn"
      title="Send message"
    >
      ↑
    </button>

  </div>

</aside>

  </div>


  <!-- ================= MODAL ================= -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modal" class="modal"></div>
  </div>


  <!-- ================= TOAST ================= -->
  <div id="toast" class="toast hidden"></div>

<script src="supabase-client.js"></script>
  <script src="script.js"></script>
</body>
</html>
